name: Build Android APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
concurrency:
  group: android-apk-build
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare fixed signing key and launcher icons
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable app/src/main/res/drawable-nodpi
          cp signing/ani-parve-release.jks app/ani-parve-release.jks
          cp signing/ic_launcher_foreground.png app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp signing/ic_launcher.jpg app/src/main/res/mipmap-$d/ic_launcher.jpg
            cp signing/ic_launcher.jpg app/src/main/res/mipmap-$d/ic_launcher_round.jpg
          done
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release APK
        env:
          ANI_PARVE_STORE_PASSWORD: AniParveRelease2026
          ANI_PARVE_KEY_PASSWORD: AniParveRelease2026
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ani-parve.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ani-parve-apk
          path: ani-parve.apk
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: אני פרווה - Build ${{ github.run_number }}
          files: ani-parve.apk
          body: |
            ## אני פרווה 2.2.1
            - שמות קבועים: שם ברירת מחדל "אני", הוספה, שינוי שם והגדרות המתנה אישיות לכל שם.
            - תיקון פריסת צ'יפים: טקסט בשורה אחת, ריווח אחיד ותמיכה במסכים צרים.
            - הגבלת זמני ההמתנה ל-6 שעות לכל היותר, ללא זמן אפס.
            - בחירה ב"אחר" מתחילה בשעה ובדקה הנוכחיות.
            - אפשרות "שמור לפעמים הבאות" לשמירת שם חדש.
            - רשימת "סיימתי לאכול לפני..." עודכנה לפי הסדר המבוקש.
            - שיפור תצוגת הכותרות והתאמה למסכים קטנים.
            - כפתור הוספת טיימר צף עבר לפינה השמאלית התחתונה.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
