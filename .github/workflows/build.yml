name: Build Android APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
concurrency:
  group: android-apk-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare fixed signing key and launcher icons
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable app/src/main/res/drawable-nodpi
          cp signing/ani-parve-release.jks app/ani-parve-release.jks
          cp signing/ic_launcher_foreground.png app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp signing/ic_launcher.jpg app/src/main/res/mipmap-$d/ic_launcher.jpg
            cp signing/ic_launcher.jpg app/src/main/res/mipmap-$d/ic_launcher_round.jpg
          done
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release APK and lint
        env:
          ANI_PARVE_STORE_PASSWORD: AniParveRelease2026
          ANI_PARVE_KEY_PASSWORD: AniParveRelease2026
        run: gradle assembleRelease lintRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ani-parve-v2.0.0.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ani-parve-v2.0.0
          path: ani-parve-v2.0.0.apk
          retention-days: 30
      - name: Publish versioned GitHub Release
        if: github.ref == 'refs/heads/feature/v2.0.0' && github.event.head_commit.message == 'Release v2.0.0 final build'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: אני פרווה 2.0
          body: |
            מה חדש בגרסה 2.0.0:
            - כמה טיימרים במקביל עם שמות ושעת סיום.
            - שמות קבועים וזמני המתנה אישיים.
            - התחלה בדיעבד, וידג'ט למסך הבית ומסך הסבר.
          files: ani-parve-v2.0.0.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
