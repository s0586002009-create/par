plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'il.co.aniparve'; compileSdk 36
 defaultConfig { applicationId 'il.co.aniparve'; minSdk 21; targetSdk 35; versionCode 14; versionName '2.63' }
 signingConfigs { release { storeFile file("ani-parve-release.jks"); storeType "JKS"; storePassword System.getenv("ANI_PARVE_STORE_PASSWORD") ?: "AniParveRelease2026"; keyAlias "aniparve"; keyPassword System.getenv("ANI_PARVE_KEY_PASSWORD") ?: "AniParveRelease2026" } }
 buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.7.0'; testImplementation 'junit:junit:4.13.2' }
// Run the timer-state unit tests as part of every release build.
afterEvaluate { tasks.named('assembleRelease') { dependsOn('testReleaseUnitTest') } }

tasks.register('printLintReport') {
    doLast {
        def report = file("$buildDir/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt")
        if (report.exists()) {
            println('===== FULL ANDROID LINT REPORT =====')
            println(report.text)
        }
    }
}
afterEvaluate { tasks.named('lintRelease') { finalizedBy('printLintReport') } }
